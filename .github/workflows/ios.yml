name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: estatia-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    # =========================
    # 📥 Checkout
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v5

    # =========================
    # 🧠 Force Xcode 26.6
    # =========================
    - name: Select Xcode 26.6
      run: |
        set -e

        echo "🔍 Checking installed Xcode versions:"
        ls -d /Applications/Xcode*.app || true

        XCODE_PATH="/Applications/Xcode_26.6.app"

        if [ ! -d "$XCODE_PATH" ]; then
          echo "❌ Xcode 26.6 not found at $XCODE_PATH"
          exit 1
        fi

        echo "✅ Using: $XCODE_PATH"
        sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

    # =========================
    # 🔍 Toolchain verification
    # =========================
    - name: Print toolchain info
      run: |
        xcodebuild -version
        swift --version

    # 🚨 Fail fast if wrong toolchain is active
    - name: Validate Xcode version
      run: |
        xcodebuild -version | grep "26.6"

    # =========================
    # ⚡ SwiftPM Cache
    # =========================
    - name: Cache SwiftPM
      uses: actions/cache@v5
      with:
        path: |
          ~/.swiftpm
          ~/Library/Caches/org.swift.swiftpm
        key: spm-${{ runner.os }}-${{ github.event.pull_request.number || github.ref_name }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ github.event.pull_request.number || github.ref_name }}-
          spm-${{ runner.os }}-

    # =========================
    # 🔐 Restore Firebase configuration from GitHub Actions secret
    # =========================
    - name: Restore Firebase plist
      env:
        GOOGLE_SERVICES_PLIST_B64: ${{ secrets.GOOGLE_SERVICES_PLIST_B64 }}
      run: |
        set -euo pipefail

        if [ -z "${GOOGLE_SERVICES_PLIST_B64:-}" ]; then
          echo "::error::Missing repository Actions secret GOOGLE_SERVICES_PLIST_B64. Add the Base64-encoded GoogleService-Info.plist under Settings > Secrets and variables > Actions."
          exit 1
        fi

        PLIST_PATH="estatia/GoogleService-Info.plist"
        mkdir -p "$(dirname "$PLIST_PATH")"

        printf '%s' "$GOOGLE_SERVICES_PLIST_B64" |
          python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read(), validate=True))' \
          > "$PLIST_PATH"

        test -s "$PLIST_PATH"
        plutil -lint "$PLIST_PATH"

        BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$PLIST_PATH")"
        if [ "$BUNDLE_ID" != "com.application.estatia" ]; then
          echo "::error::Firebase plist BUNDLE_ID does not match com.application.estatia."
          exit 1
        fi

        echo "Firebase plist restored and validated."

    # =========================
    # 📦 Resolve Dependencies
    # =========================
    - name: Resolve Swift Packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -project estatia.xcodeproj

    # =========================
    # 🧪 Build for testing
    # =========================
    - name: Build for testing
      run: |
        xcodebuild clean build-for-testing \
          -project estatia.xcodeproj \
          -scheme estatia \
          -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro,arch=arm64" \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    # =========================
    # ▶️ Execute unit and UI tests
    # =========================
    - name: Run tests
      run: |
        xcodebuild test-without-building \
          -project estatia.xcodeproj \
          -scheme estatia \
          -destination "platform=iOS Simulator,OS=26.2,name=iPhone 17 Pro,arch=arm64" \
          -derivedDataPath build \
          -resultBundlePath build/TestResults.xcresult \
          -parallel-testing-enabled NO \
          CODE_SIGNING_ALLOWED=NO

    # =========================
    # 📦 Artifacts on failure
    # =========================
    - name: Upload CI diagnostics
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: xcode-ci-diagnostics
        path: |
          build/TestResults.xcresult
          ~/Library/Logs/DiagnosticReports
        if-no-files-found: ignore
