name: Player and Home Feed Package Tests

on:
  push:
    branches:
      - main
      - chore/player-*
      - feat/player-*
    paths:
      - "packages/CorePlayerEngine/**"
      - "packages/CorePlayerUI/**"
      - "packages/FeatureHome/**"
      - "packages/CoreAppData/**"
      - "packages/CoreNetwork/**"
      - "packages/CoreModel/**"
      - "packages/CoreDesignSystem/**"
      - "packages/CoreImagePipeline/**"
      - "packages/CoreMediaPipeline/**"
      - ".github/workflows/player-packages.yml"
  pull_request:
    paths:
      - "packages/CorePlayerEngine/**"
      - "packages/CorePlayerUI/**"
      - "packages/FeatureHome/**"
      - "packages/CoreAppData/**"
      - "packages/CoreNetwork/**"
      - "packages/CoreModel/**"
      - "packages/CoreDesignSystem/**"
      - "packages/CoreImagePipeline/**"
      - "packages/CoreMediaPipeline/**"
      - ".github/workflows/player-packages.yml"

concurrency:
  group: estatia-player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-player-engine:
    name: CorePlayerEngine
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: |
          set -e
          XCODE_PATH="/Applications/Xcode_26.6.app"
          test -d "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Build and test package
        run: swift test --package-path packages/CorePlayerEngine

  core-player-ui:
    name: CorePlayerUI
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: |
